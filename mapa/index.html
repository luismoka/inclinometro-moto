<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotoLean · Mapa de ruta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--fondo:#14161a;--panel:#1e2127;--texto:#e8eaed;--suave:#9aa0a8;--linea:#31353d}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--linea)}
  h1{font-size:17px;margin:0 8px 0 0}
  label.b,select{background:#2b2f37;color:var(--texto);border:1px solid var(--linea);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
  input[type=file]{display:none}
  #datos{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--linea)}
  .d{background:#262a31;border-radius:8px;padding:6px 12px;min-width:104px}
  .d span{display:block;font-size:11px;color:var(--suave)}
  .d b{font-size:18px}
  #mapa{flex:1;min-height:300px;background:#0d0f12}
  #leyenda{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;color:var(--suave)}
  #leyenda i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}
  #vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--suave);pointer-events:none;z-index:500}
  .wrap{position:relative;flex:1;display:flex}
</style>
</head>
<body>
<header>
  <h1>MotoLean · Mapa de ruta</h1>
  <label class="b">Abrir ruta (.csv)<input type="file" id="fichero" accept=".csv,text/csv"></label>
  <select id="modo" aria-label="Color del trazado">
    <option value="lean">Color por inclinación</option>
    <option value="vel">Color por velocidad</option>
  </select>
  <div id="leyenda"></div>
</header>
<div id="datos" hidden></div>
<div class="wrap">
  <div id="mapa"></div>
  <div id="vacio">Abre un archivo de ruta descargado de la placa<br>(página «Rutas grabadas» → Descargar).</div>
</div>
<script>
// Umbrales iguales a los de la pantalla de la placa
const COL_LEAN=[[10,'#7d8590','< 10°'],[25,'#2c8cff','10–25°'],[40,'#ffd000','25–40°'],[999,'#ff3228','> 40°']];
const COL_VEL=[[50,'#7d8590','< 50'],[90,'#2c8cff','50–90'],[120,'#ffd000','90–120'],[9999,'#ff3228','> 120 km/h']];
const FRENADA=0.5, ACELERON=0.4;   // g a partir de los que se marca el punto

const mapa=L.map('mapa').setView([40.2,-3.7],6);
// Fondos de mapa que no piden clave ni rechazan paginas abiertas desde un archivo local.
// Se cambia de uno a otro con el selector de capas (arriba a la derecha del mapa).
const fondos={
  'Mapa (IGN España)':L.tileLayer('https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}',
    {maxZoom:19,attribution:'CC BY 4.0 <a href="https://www.ign.es">ign.es</a>'}),
  'Calles (Esri)':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,attribution:'Tiles &copy; Esri'}),
  'Satélite (Esri)':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics'}),
};
fondos['Mapa (IGN España)'].addTo(mapa);
L.control.layers(fondos,null,{collapsed:false}).addTo(mapa);
const capa=L.layerGroup().addTo(mapa);
let puntos=[];

function leeCSV(txt){
  const lin=txt.trim().split(/\r?\n/), out=[];
  for(let i=1;i<lin.length;i++){
    const c=lin[i].split(',').map(Number);
    if(c.length<7||c.some(isNaN)) continue;
    if(Math.abs(c[1])<0.0001&&Math.abs(c[2])<0.0001) continue;
    out.push({t:c[0],lat:c[1],lon:c[2],v:c[3],lean:c[4],amax:c[5],amin:c[6]});
  }
  return out;
}
function metros(a,b){
  const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function color(p,modo){
  const tabla=modo==='vel'?COL_VEL:COL_LEAN, x=modo==='vel'?p.v:Math.abs(p.lean);
  return tabla.find(f=>x<f[0])[1];
}
function hora(t){return new Date(t*1000).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function ficha(p){
  const lado=p.lean<-1.5?' izquierda':p.lean>1.5?' derecha':'';
  return `<b>${hora(p.t)}</b><br>${p.v.toFixed(0)} km/h<br>Inclinación ${Math.abs(p.lean).toFixed(0)}°${lado}`+
         `<br>Aceleración ${p.amax.toFixed(2)} g · Frenada ${(-Math.min(p.amin,0)).toFixed(2)} g`;
}
function leyenda(modo){
  document.getElementById('leyenda').innerHTML=(modo==='vel'?COL_VEL:COL_LEAN)
    .map(f=>`<span><i style="background:${f[1]}"></i>${f[2]}</span>`).join('')+
    '<span><i style="background:#ff8c00;height:10px;width:10px;border-radius:50%"></i>frenada fuerte</span>'+
    '<span><i style="background:#3cdc5a;height:10px;width:10px;border-radius:50%"></i>acelerón</span>';
}
function pinta(){
  const modo=document.getElementById('modo').value;
  leyenda(modo); capa.clearLayers();
  if(!puntos.length) return;
  // Tramos seguidos del mismo color; un salto de mas de 60 s o 500 m parte el trazado
  let tramo=[puntos[0]], col=color(puntos[0],modo);
  const cierra=()=>{ if(tramo.length>1) L.polyline(tramo.map(p=>[p.lat,p.lon]),{color:col,weight:5,opacity:.9}).addTo(capa); };
  for(let i=1;i<puntos.length;i++){
    const p=puntos[i], a=puntos[i-1], c=color(p,modo);
    const salto=p.t-a.t>60||metros(a,p)>500;
    if(salto){ cierra(); tramo=[p]; col=c; continue; }
    tramo.push(p);
    if(c!==col){ cierra(); tramo=[p]; col=c; }
  }
  cierra();
  // Puntos pulsables cada pocos registros, y marcas de frenadas y acelerones
  puntos.forEach((p,i)=>{
    const frena=p.amin<=-FRENADA, acel=p.amax>=ACELERON;
    if(frena||acel) L.circleMarker([p.lat,p.lon],{radius:6,color:'#000',weight:1,fillColor:frena?'#ff8c00':'#3cdc5a',fillOpacity:1}).bindPopup(ficha(p)).addTo(capa);
    else if(i%3===0) L.circleMarker([p.lat,p.lon],{radius:7,opacity:0,fillOpacity:0}).bindPopup(ficha(p)).addTo(capa);
  });
}
function resumen(){
  let dist=0, mov=0;
  for(let i=1;i<puntos.length;i++){ const dt=puntos[i].t-puntos[i-1].t; if(dt<=60){ dist+=metros(puntos[i-1],puntos[i]); mov+=dt; } }
  const mx=f=>puntos.reduce((m,p)=>Math.max(m,f(p)),0);
  const d=new Date(puntos[0].t*1000);
  const celdas=[
    ['Fecha',d.toLocaleDateString('es-ES')+' '+hora(puntos[0].t).slice(0,5)],
    ['Distancia',(dist/1000).toFixed(1)+' km'],
    ['En movimiento',Math.floor(mov/3600)+' h '+Math.round(mov%3600/60)+' min'],
    ['Vel. máxima',mx(p=>p.v).toFixed(0)+' km/h'],
    ['Vel. media',(mov?dist/mov*3.6:0).toFixed(0)+' km/h'],
    ['Máx. izquierda',mx(p=>-p.lean).toFixed(0)+'°'],
    ['Máx. derecha',mx(p=>p.lean).toFixed(0)+'°'],
    ['Máx. aceleración',mx(p=>p.amax).toFixed(2)+' g'],
    ['Máx. frenada',mx(p=>-p.amin).toFixed(2)+' g'],
  ];
  const el=document.getElementById('datos');
  el.innerHTML=celdas.map(c=>`<div class="d"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('');
  el.hidden=false;
}
function carga(txt){
  const p=leeCSV(txt);
  if(!p.length){ alert('El archivo no contiene puntos de ruta válidos.'); return; }
  puntos=p;
  document.getElementById('vacio').style.display='none';
  resumen(); pinta();
  mapa.invalidateSize();
  mapa.fitBounds(L.latLngBounds(puntos.map(q=>[q.lat,q.lon])),{padding:[30,30]});
}
document.getElementById('fichero').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>carga(r.result); r.readAsText(f);
});
document.getElementById('modo').addEventListener('change',pinta);
leyenda('lean');
</script>
</body>
</html>
